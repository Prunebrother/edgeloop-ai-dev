# AGPL-3.0-only. Windows checks for the EdgeLoop AI fork: the Python suite on Windows, and a
# real setup -> start -> health -> stop -> uninstall cycle with a test bundle (no model store,
# no GPU, no toys). Runs on pushes to Windows work branches and on demand. Publishes nothing.
name: Windows

on:
  push:
    branches: ['feature/windows-**', 'release/**', 'ci/windows-full-**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    if: ${{ !startsWith(github.ref_name, 'ci/windows-full-') }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # Keep files byte-identical to the repository (recorded checksums cover character files).
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --disable-pip-version-check -r requirements.lock colorama==0.4.6 setuptools==84.2.1 wheel==0.48.0
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .
      - name: Tests
        env:
          PYTHONUTF8: '1'
        run: python -m pytest -q -p no:cacheprovider --junitxml=pytest-windows.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-windows
          path: pytest-windows.xml

  build-lite:
    if: ${{ !startsWith(github.ref_name, 'ci/windows-full-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Export the reviewed source
        run: python3 tools/export-public-source.py --out "$RUNNER_TEMP/source"
      - name: Build the Windows test bundle and setup folder
        run: python3 "$RUNNER_TEMP/source/tools/windows/build-windows.py" --work "$RUNNER_TEMP/work" --lite --iscc none
      - uses: actions/upload-artifact@v4
        with:
          name: windows-lite
          compression-level: 0
          retention-days: 3
          path: |
            ${{ runner.temp }}/work/dist/edgeloop-ai-windows-x86_64.tar.gz.part*
            ${{ runner.temp }}/work/setup/

  setup-cycle:
    needs: build-lite
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-lite
          path: lite
      - name: Compile the setup program
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y; }
          & $iscc /Q /O"$PWD\lite\dist" lite\setup\edgeloop-ai.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-ChildItem lite\dist
      - name: Install silently (parts next to setup, as for an offline install)
        shell: pwsh
        run: |
          $setup = Get-ChildItem lite\dist\EdgeLoop-AI-Setup-*.exe | Select-Object -First 1
          $p = Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/LOG=$PWD\setup-inno.log" -Wait -PassThru
          Get-Content "$env:LOCALAPPDATA\EdgeLoop AI\logs\setup.log" -ErrorAction SilentlyContinue
          if ($p.ExitCode) { Get-Content setup-inno.log -Tail 40; exit $p.ExitCode }
          Get-ChildItem "$env:LOCALAPPDATA\Programs\EdgeLoop AI"
          Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Filter 'EdgeLoop*'
      - name: Repair the same version and verify successful finalization
        shell: pwsh
        run: |
          $data = "$env:LOCALAPPDATA\EdgeLoop AI\data"
          $before = (Get-FileHash "$data\selection.json" -Algorithm SHA256).Hash
          $setup = Get-ChildItem lite\dist\EdgeLoop-AI-Setup-*.exe | Select-Object -First 1
          $p = Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/LOG=$PWD\repair-inno.log" -Wait -PassThru
          if ($p.ExitCode) { Get-Content repair-inno.log -Tail 40; exit $p.ExitCode }
          if ((Get-FileHash "$data\selection.json" -Algorithm SHA256).Hash -ne $before) { throw 'Repair changed saved model selection' }
          $leftovers = Get-ChildItem "$env:LOCALAPPDATA\Programs\EdgeLoop AI" -Directory | Where-Object Name -match '\.(previous|incoming|retired)$'
          if ($leftovers) { throw "Repair did not finalize: $($leftovers.Name)" }
          $setupLog = Get-Content "$env:LOCALAPPDATA\EdgeLoop AI\logs\setup.log" -Raw
          if ($setupLog -notmatch 'Setup completed; previous installation files and cached downloads cleaned up') { throw 'Setup finalization hook did not run' }
      - name: Start, check every service, stop
        shell: pwsh
        env:
          EDGELOOP_WINDOWS_QUIET: '1'
        run: |
          $root = Get-ChildItem "$env:LOCALAPPDATA\Programs\EdgeLoop AI" -Directory | Where-Object Name -like 'v*' | Select-Object -First 1
          $py = Join-Path $root.FullName '.venv\Scripts\python.exe'
          $launcher = Join-Path $root.FullName 'tools\windows\edgeloop_ai_windows.py'
          & $py $launcher start --no-browser --quiet
          if ($LASTEXITCODE) { Get-Content "$env:LOCALAPPDATA\EdgeLoop AI\logs\*.log"; exit 1 }
          & $py $launcher status
          $tags = Invoke-RestMethod http://127.0.0.1:11435/api/tags
          $health = Invoke-RestMethod http://127.0.0.1:8768/health
          $page = Invoke-WebRequest http://127.0.0.1:8770/ -UseBasicParsing
          if (-not $health.ok -or -not $health.read_only -or $page.Content -notmatch 'EdgeLoop') { throw 'Unhealthy stack' }
          foreach ($bad in @('src/js/..%5C..%5C.venv%5Cpyvenv.cfg', 'src/js/app.js::%24DATA', 'MANIFEST.json', 'SOURCE-MANIFEST.json')) {
            try { Invoke-WebRequest "http://127.0.0.1:8770/$bad" -UseBasicParsing | Out-Null; throw "Served $bad" }
            catch [System.Net.WebException] { } catch { if ($_.Exception.Response.StatusCode.value__ -ne 404) { throw } }
          }
          # A second start must reuse the running stack, not start another.
          & $py $launcher start --no-browser --quiet
          if ($LASTEXITCODE) { exit 1 }
          & $py $launcher stop --quiet
          Start-Sleep 2
          foreach ($port in 11435, 8768, 8770) {
            if (Get-NetTCPConnection -LocalPort $port -State Listen -ErrorAction SilentlyContinue) { throw "Port $port still open after stop" }
          }
          Get-Content "$env:LOCALAPPDATA\EdgeLoop AI\logs\observer.log" -Tail 5
      - name: Uninstall silently
        shell: pwsh
        run: |
          $u = Get-ChildItem "$env:LOCALAPPDATA\Programs\EdgeLoop AI\unins*.exe" | Select-Object -First 1
          Start-Process $u.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          Start-Sleep 5
          if (Test-Path "$env:LOCALAPPDATA\Programs\EdgeLoop AI\v*") { throw 'Bundle left behind after uninstall' }
          if (-not (Test-Path "$env:LOCALAPPDATA\EdgeLoop AI\data\selection.json")) { throw 'User data was removed' }
      - name: Collect logs
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force logs | Out-Null
          Copy-Item setup-inno.log logs -ErrorAction SilentlyContinue
          Copy-Item repair-inno.log logs -ErrorAction SilentlyContinue
          Copy-Item "$env:LOCALAPPDATA\EdgeLoop AI\logs\*" logs -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: setup-cycle-logs
          path: logs/

  # Full bundle from a draft release (assets staged before publication): install offline from the
  # downloaded parts, start, and get a real companion reply on the runner's CPU. Push a branch named
  # ci/windows-full-<tag> to run it; it reads the draft with this repository's token and publishes nothing.
  full-cycle:
    if: startsWith(github.ref_name, 'ci/windows-full-')
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: write   # Draft releases are only visible with write access; nothing is written.
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download the staged release
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'.Substring('ci/windows-full-'.Length)
          New-Item -ItemType Directory -Force D:\rel | Out-Null
          # Draft releases are not found by tag, so look the release up in the list.
          $release = gh api "repos/${{ github.repository }}/releases?per_page=30" | ConvertFrom-Json | Where-Object tag_name -eq $tag | Select-Object -First 1
          if (-not $release) { throw "No release for $tag" }
          foreach ($asset in $release.assets) {
            if ($asset.name -match '^(EdgeLoop-AI-Setup-.*\.exe|edgeloop-ai-windows-x86_64\.tar\.gz\.part\d\d|SHA256SUMS)$') {
              curl.exe -fsSL --retry 3 -H "Authorization: Bearer $env:GH_TOKEN" -H 'Accept: application/octet-stream' $asset.url -o "D:\rel\$($asset.name)"
              if ($LASTEXITCODE) { throw "Download failed: $($asset.name)" }
            }
          }
          Get-ChildItem D:\rel | Format-Table Name, Length
          Get-PSDrive C, D | Format-Table Name, Free
      - name: Check the downloads against SHA256SUMS
        shell: pwsh
        run: |
          foreach ($line in Get-Content D:\rel\SHA256SUMS) {
            $sum, $name = $line -split '\s+', 2
            if (Test-Path "D:\rel\$name") {
              $actual = (Get-FileHash "D:\rel\$name" -Algorithm SHA256).Hash.ToLower()
              if ($actual -ne $sum) { throw "Checksum mismatch: $name" }
              "ok $name"
            }
          }
      - name: Install silently from the parts next to setup
        shell: pwsh
        run: |
          $setup = Get-ChildItem D:\rel\EdgeLoop-AI-Setup-*.exe | Select-Object -First 1
          $p = Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/LOG=D:\setup-inno.log" -Wait -PassThru
          Get-Content "$env:LOCALAPPDATA\EdgeLoop AI\logs\setup.log"
          if ($p.ExitCode) { Get-Content D:\setup-inno.log -Tail 40; exit $p.ExitCode }
          Remove-Item D:\rel\*.part* -Force
      - name: Start and get a companion reply
        shell: pwsh
        env:
          EDGELOOP_WINDOWS_QUIET: '1'
        run: |
          $root = Get-ChildItem "$env:LOCALAPPDATA\Programs\EdgeLoop AI" -Directory | Where-Object Name -like 'v*' | Select-Object -First 1
          $py = Join-Path $root.FullName '.venv\Scripts\python.exe'
          $launcher = Join-Path $root.FullName 'tools\windows\edgeloop_ai_windows.py'
          & $py $launcher start --no-browser --quiet
          if ($LASTEXITCODE) { Get-Content "$env:LOCALAPPDATA\EdgeLoop AI\logs\*.log" -Tail 30; exit 1 }
          $names = (Invoke-RestMethod http://127.0.0.1:11435/api/tags).models.name
          $names
          foreach ($c in 'nova-narrative-f29-v011:latest','evelyn-narrative-f29-v013:latest','daisy-narrative-f29-v014:latest','celeste-narrative-f29-v012:latest') {
            if ($names -notcontains $c) { throw "Missing companion $c" }
          }
          $body = @{ model = 'nova-narrative-f29-v011'; stream = $false; think = $false; options = @{ num_predict = 40 };
                     messages = @(@{ role = 'user'; content = 'Say hello and introduce yourself in one sentence.' }) } | ConvertTo-Json -Depth 5
          $reply = Invoke-RestMethod http://127.0.0.1:11435/api/chat -Method Post -Body $body -ContentType 'application/json' -TimeoutSec 1200
          "Reply: $($reply.message.content)"
          if (-not $reply.message.content) { throw 'Empty reply' }
          & $py $launcher stop --quiet
      - name: Uninstall silently
        shell: pwsh
        run: |
          $u = Get-ChildItem "$env:LOCALAPPDATA\Programs\EdgeLoop AI\unins*.exe" | Select-Object -First 1
          Start-Process $u.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          Start-Sleep 5
          if (Test-Path "$env:LOCALAPPDATA\Programs\EdgeLoop AI\v*") { throw 'Bundle left behind after uninstall' }
      - name: Collect logs
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force logs | Out-Null
          Copy-Item D:\setup-inno.log logs -ErrorAction SilentlyContinue
          Copy-Item "$env:LOCALAPPDATA\EdgeLoop AI\logs\*" logs -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-cycle-logs
          path: logs/
